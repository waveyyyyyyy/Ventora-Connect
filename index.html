<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#ffffff"/><link rel="icon" type="image/svg+xml" href="%BASE_URL%ventora-icon.svg"/><meta property="og:title" content="Ventora Connect — Where Ambition Meets Opportunity"/><meta property="og:description" content="A considered ecosystem connecting ambitious businesses and investors."/><meta name="description" content="Ventora Connect — Where Ambition Meets Opportunity. A trusted ecosystem connecting ambitious businesses with investors."/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><title>Ventora Connect — Where Ambition Meets Opportunity</title></head><body><div id="ventora-boot-screen" aria-label="Loading Ventora Connect"><div class="ventora-boot-card"><div class="ventora-boot-word">VENTORA <span>CONNECT</span></div><div class="ventora-boot-box"><i></i><i></i><i></i><i></i></div><div class="ventora-boot-track"><i></i></div><small>PREPARING YOUR SPACE</small></div></div><div id="root"></div><style>
html,body{min-height:100%;background:#f8fbff}
#ventora-boot-screen{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:linear-gradient(145deg,#fff 0%,#f4f8ff 58%,#edf4ff 100%);color:#10213b;font-family:Manrope,"DM Sans",Arial,sans-serif}
.ventora-boot-card{width:min(320px,86vw);min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;border:1px solid #dce8f8;border-radius:24px;background:rgba(255,255,255,.88);box-shadow:0 22px 70px rgba(30,64,120,.12)}
.ventora-boot-word{font-size:20px;font-weight:850;letter-spacing:.18em;text-align:center}.ventora-boot-word span{display:block;margin-top:7px;font-size:9px;letter-spacing:.48em;color:#647b9a}
.ventora-boot-box{position:relative;width:56px;height:56px;margin:36px 0 30px;transform-style:preserve-3d;animation:ventora-boot-bounce 1.05s cubic-bezier(.36,.07,.2,.98) infinite}
.ventora-boot-box i{position:absolute;inset:0;border:2px solid #2563eb;border-radius:12px;background:linear-gradient(145deg,#a5e5ff,#3984ed);box-shadow:inset 0 2px 8px #fff9,0 9px 24px #2563eb35}
.ventora-boot-box i:nth-child(2){transform:translate(7px,-7px);opacity:.55}.ventora-boot-box i:nth-child(3){transform:translate(14px,-14px);opacity:.28}.ventora-boot-box i:nth-child(4){transform:translate(21px,-21px);opacity:.13}
.ventora-boot-track{width:160px;height:3px;overflow:hidden;border-radius:4px;background:#dce8f8}.ventora-boot-track i{display:block;width:38%;height:100%;border-radius:4px;background:#2563eb;animation:ventora-boot-progress 1.2s ease-in-out infinite}
.ventora-boot-card small{margin-top:15px;font-size:8px;font-weight:800;letter-spacing:.18em;color:#647b9a}
@keyframes ventora-boot-bounce{0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}45%{transform:translateY(-13px) rotate(5deg) scale(1.04)}65%{transform:translateY(2px) rotate(0) scale(.94,1.06)}}
@keyframes ventora-boot-progress{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
@media(prefers-reduced-motion:reduce){.ventora-boot-box,.ventora-boot-track i{animation:none}}
</style><script type="module" src="/src/main.tsx"></script></body></html>
