name: Deploy Ventora Connect to GitHub Pages

on:
  push:
    branches:
      - main
      - fix/auth-session-regressions-20261123
      - fix/prevent-random-role-selector-20261123
      - fix/member-api-auth-and-page-backgrounds-20261123
      - fix/sitewide-text-contrast-20261123
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-ventora
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run authentication regression tests
        run: pnpm test

      - name: Build static site
        run: pnpm build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Add SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
