<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventora Connect — Interactive Mockup</title><style>
:root{--g:#174f3b;--lime:#c9f36a;--ink:#17231f;--muted:#75817a;--line:#e5e9e3;--bg:#f5f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui, sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{font-weight:950;letter-spacing:.13em}.brand small{display:block;font-size:9px;letter-spacing:.32em;color:#829087}.layout{display:grid;grid-template-columns:245px 1fr;max-width:1450px;margin:auto}.side{height:calc(100vh - 68px);position:sticky;top:68px;overflow:auto;background:#fafbf8;border-right:1px solid var(--line);padding:18px 13px}.label{font-size:10px;font-weight:850;letter-spacing:.16em;color:#9aa49c;padding:14px 10px 6px}.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;color:#56635a;font-weight:650}.nav:hover,.nav.active{background:#eaf2e9;color:var(--g)}.main{padding:32px clamp(16px,4vw,50px);max-width:1200px;width:100%;margin:auto}.hero{background:#101a17;color:white;padding:clamp(25px,5vw,55px);border-radius:22px}.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:850;color:#6e8a75}.hero .eyebrow{color:var(--lime)}h1{font-size:clamp(34px,5vw,58px);line-height:1.03;letter-spacing:-.05em;margin:15px 0;max-width:720px}h1 em{font-style:normal;color:var(--lime)}.hero p{color:#c3cec6;max-width:560px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--g);color:white;font-weight:750}.btn.light{background:var(--lime);color:#17231f}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.btn.sm{font-size:12px;padding:7px 10px}.head{margin:30px 0 15px}.head h2{font-size:25px;letter-spacing:-.04em;margin:3px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.card h3{margin:0 0 6px}.card p{color:var(--muted);font-size:13px}.avatar{width:43px;height:43px;display:inline-grid;place-items:center;border-radius:13px;background:#e4eee5;color:var(--g);font-weight:900;margin-right:10px}.row{display:flex;align-items:center;gap:10px}.pill{display:inline-block;background:#edf4e9;color:var(--g);border-radius:30px;padding:4px 9px;font-size:10px;font-weight:850;margin:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.search,.field input,.field textarea,.field select{padding:10px 12px;border:1px solid #dfe5dd;border-radius:9px;background:white;width:100%}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;font-weight:750}.field textarea{min-height:90px}.form{max-width:720px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{font-size:25px;display:block}.stat small{color:var(--muted)}.list{display:grid;gap:9px}.item{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.note{padding:12px;border-radius:10px;background:#edf4e9;color:#315b3c;margin:12px 0;font-size:13px}.foot{border-top:1px solid var(--line);margin-top:40px;padding:22px 0;color:#89948b;font-size:11px}.hamb{display:none}.demo{position:fixed;right:14px;bottom:12px;background:#17231f;color:#d9f5aa;padding:8px 12px;border-radius:30px;font-size:11px;z-index:9}@media(max-width:850px){.layout{display:block}.side{position:fixed;z-index:8;top:0;left:0;height:100dvh;width:260px;transform:translateX(-110%);transition:.2s;box-shadow:0 0 0 100vw #0000}.side.open{transform:translateX(0);box-shadow:0 0 0 100vw #0007}.hamb{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:20px 15px}}@media(max-width:560px){.grid,.two{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}.top{padding:0 14px}.hero{border-radius:16px}.main{padding:16px 13px}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><div class="row"><button class="btn ghost hamb" onclick="document.querySelector('.side').classList.toggle('open')">☰</button><div class="brand">VΞNTORA<small>CONNECT</small></div></div><div class="row"><button class="btn ghost" onclick="modal('Log in')">Log in</button><button class="btn" onclick="modal('Create account')">Get started ↗</button></div></header><div class="layout"><aside class="side"><div class="label">DISCOVER</div><div id="nav"></div><div class="label">MEMBER WORKSPACE</div><div id="nav2"></div><div class="label">ADMINISTRATION · PREVIEW</div><button class="nav" onclick="go('Admin portal')">▤ &nbsp;Admin portal</button><div class="note">Standalone prototype. Sample content only; no real account or database actions.</div></aside><main class="main" id="main"></main></div><div class="demo">● DEMO MODE · NO LIVE DATA</div><div id="modal"></div><script>
const discover=['Overview','Business listings','Investor directory'],workspace=['Dashboard','Personal profile','Manage businesses','Investor preferences','Verification','Messages','Investment interests','Suggested matches','Saved profiles','Announcements','Notifications','Support','Subscriptions','Settings'];
const biz=[['Northstar Mobility','Clean mobility','Bengaluru, India','Seed','₹1.5 Cr','Electric fleet infrastructure for growing cities.','N'],['Aster Labs','Health technology','Pune, India','Pre-seed','₹75 L','Preventive diagnostics made more accessible.','A'],['TerraGrid','Climate technology','Mumbai, India','Series A','₹4 Cr','Helping businesses measure and reduce energy use.','T'],['CraftCart','Commerce','Jaipur, India','Seed','₹50 L','A marketplace for independent makers.','C']];
const inv=[['Mira Capital','Angel network','Bengaluru, India','₹10L–₹50L','Climate · SaaS','M'],['Arjun Mehta','Angel investor','Mumbai, India','₹5L–₹25L','Health · Consumer','A'],['Horizon Ventures','Early-stage fund','Delhi, India','₹50L–₹3Cr','Mobility · AI','H'],['Priya Shah','Angel investor','Pune, India','₹10L–₹1Cr','Commerce · SaaS','P']];
let page='Overview',saved=[0,2],notice='';
function navButton(n){return '<button class="nav" onclick="go(\''+n+'\')">'+(n==='Overview'?'⌂':n==='Business listings'?'▦':n==='Investor directory'?'◉':'•')+' &nbsp;'+n+'</button>'}
document.getElementById('nav').innerHTML=discover.map(navButton).join('');document.getElementById('nav2').innerHTML=workspace.map(navButton).join('');
function go(n){page=n;notice='';document.querySelector('.side').classList.remove('open');render();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.textContent.includes(n)))}
function head(k,t,s){return '<div class="head"><div class="eyebrow">'+k+'</div><h2>'+t+'</h2><p class="muted">'+(s||'')+'</p></div>'}
function card(b,i){return '<article class="card"><div class="row"><span class="avatar">'+b[6]+'</span><div><h3>'+b[0]+'</h3><small class="muted">'+b[1]+'</small></div></div><p>'+b[5]+'</p><span class="pill">'+b[3]+'</span><span class="pill">'+b[4]+'</span><p>⌖ '+b[2]+'</p><div class="toolbar"><button class="btn sm" onclick="modal(\''+b[0]+'\')">View profile ↗</button><button class="btn ghost sm" onclick="save('+i+')">'+(saved.includes(i)?'★ Saved':'☆ Save')+'</button></div></article>'}
function investorCard(b){return '<article class="card"><div class="row"><span class="avatar">'+b[5]+'</span><div><h3>'+b[0]+'</h3><small class="muted">'+b[1]+'</small></div></div><p>Investment range: <b>'+b[3]+'</b></p><p>Focus: '+b[4]+'</p><p>⌖ '+b[2]+'</p><button class="btn sm" onclick="modal(\''+b[0]+'\')">View profile ↗</button> <button class="btn ghost sm" onclick="flash('Connection request sent in this preview.')">Connect</button></article>'}
function field(label,placeholder){return '<div class="field"><label>'+label+'</label><input placeholder="'+placeholder+'"></div>'}
function flash(s){notice=s;render()}
function save(i){saved.includes(i)?saved=saved.filter(x=>x!==i):saved.push(i);render()}
function modal(title){document.getElementById('modal').innerHTML='<div onclick="if(event.target===this)this.remove()" style="position:fixed;inset:0;background:#07140fc9;z-index:20;display:grid;place-items:center;padding:18px"><div class="card" style="max-width:480px;width:100%"><button class="btn ghost sm" style="float:right" onclick="this.closest(\'[style*=fixed]\').remove()">✕</button><h2>'+title+'</h2><p>This is a prototype interaction. No real data is read or submitted.</p><div class="field"><label>Sample details</label><input placeholder="Type here…"></div><button class="btn" onclick="this.closest(\'[style*=fixed]\').remove();flash(\'Action completed in preview only.\')">Continue</button></div></div>'}
function render(){let h='';
if(page==='Overview')h='<section class="hero"><div class="eyebrow">VENTORA CONNECT · WHERE AMBITION MEETS OPPORTUNITY</div><h1>Build what’s next.<br><em>Find who’s next to you.</em></h1><p>A considered space for ambitious businesses and investors to discover each other, start conversations and explore what could be possible.</p><div class="toolbar"><button class="btn light" onclick="go(\'Business listings\')">Explore businesses ↗</button><button class="btn ghost" onclick="go(\'Investor directory\')">Discover investors</button></div></section>'+head('A NETWORK BUILT FOR MOMENTUM','Discover opportunities','Explore businesses looking to meet potential investors.')+'<div class="grid">'+biz.slice(0,3).map(card).join('')+'</div>'+head('HOW IT WORKS','From discovery to conversation','Discover · Connect · Explore')+'<div class="grid"><div class="card"><h3>01 · Discover</h3><p>Explore business profiles and investor preferences.</p></div><div class="card"><h3>02 · Connect</h3><p>Send connection requests and message accepted connections.</p></div><div class="card"><h3>03 · Explore</h3><p>Track non-binding expressions of interest.</p></div></div><div class="note">Ventora is a discovery and networking service. It does not provide investment advice, hold funds or execute transactions.</div>';
else if(page==='Business listings')h=head('DISCOVER','Business listings','Explore businesses open to meeting potential investors.')+'<input class="search" placeholder="Search business listings…" oninput="filter(this.value)"><div class="grid" id="cards">'+biz.map(card).join('')+'</div>';
else if(page==='Investor directory')h=head('DISCOVER','Investor directory','Find investors by focus, stage and location.')+'<input class="search" placeholder="Search investors…" oninput="filter(this.value)"><div class="grid" id="cards">'+inv.map(investorCard).join('')+'</div>';
else if(page==='Dashboard')h=head('MEMBER WORKSPACE','Good to see you again.','A quick view of your Ventora activity.')+'<div class="card row"><span class="avatar">W</span><div><b>Welcome, Ventora member</b><p class="muted">Business account · Profile completion 75%</p></div></div><div class="statgrid">'+[['08','Profile views'],['03','Connections'],['02','Interests received'],['04','Suggested matches']].map(x=>'<div class="stat"><b>'+x[0]+'</b><small>'+x[1]+'</small></div>').join('')+'</div><div class="grid two"><div class="card"><h3>Complete your profile</h3><p>Add details so other members can understand what you do.</p><button class="btn sm" onclick="go(\'Personal profile\')">Edit profile</button></div><div class="card"><h3>New opportunities</h3><p>See businesses and investors around your interests.</p><button class="btn sm" onclick="go(\'Suggested matches\')">View matches</button></div></div>';
else if(page==='Personal profile')h=head('YOUR ACCOUNT','Personal profile','Manage the information other members can see.')+'<div class="card form"><div class="row"><span class="avatar">W</span><b>Ventora Member</b></div>'+field('Full name','Your name')+field('City','Bengaluru')+field('Country','India')+field('Short bio','Tell members about yourself')+field('Website or LinkedIn','https://')+'<button class="btn" onclick="flash(\'Profile saved in preview only.\')">Save profile</button></div>';
else if(page==='Manage businesses')h=head('BUSINESS WORKSPACE','Manage businesses','Create, edit and publish business profiles.')+'<div class="card"><div class="row"><span class="avatar">N</span><div style="flex:1"><h3>Northstar Mobility</h3><p>Clean mobility · Bengaluru</p></div><span class="pill">Published</span></div><div class="toolbar"><button class="btn sm" onclick="modal(\'Edit business\')">Edit business</button><button class="btn ghost sm" onclick="modal(\'Add a business\')">＋ Add business</button></div><p>Company · Industry · Description · Location · Stage · Funding requirement · Equity · Pitch deck</p></div>';
else if(page==='Investor preferences')h=head('INVESTOR WORKSPACE','Investor preferences','Tell businesses what opportunities interest you.')+'<div class="card form">'+field('Investment range','₹10L – ₹50L')+field('Preferred industries','Climate tech, SaaS, mobility')+field('Preferred stages','Seed, Pre-seed')+field('Preferred locations','India')+field('Investment strategy','Describe your approach')+'<button class="btn" onclick="flash(\'Preferences saved in preview only.\')">Save preferences</button></div>';
else if(page==='Verification')h=head('TRUST & SAFETY','Verification','Submit information for an authorised review.')+'<div class="grid two"><div class="card"><span class="pill">NOT SUBMITTED</span><h3>Identity verification</h3><p>Submit an identity document for review. Documents are intended to remain private.</p><button class="btn sm" onclick="modal(\'Identity verification\')">Start verification</button></div><div class="card"><span class="pill">OPTIONAL</span><h3>Business verification</h3><p>Provide supporting business details for review.</p><button class="btn ghost sm" onclick="modal(\'Business verification\')">View requirements</button></div></div>';
else if(page==='Messages')h=head('PRIVATE MESSAGING','Messages','Conversations after an accepted connection.')+'<div class="grid two"><div class="card"><h3>Conversations</h3><div class="list"><div class="item" onclick="modal(\'Mira Capital conversation\')">Mira Capital · Thanks for sharing your profile…</div><div class="item" onclick="modal(\'Aster Labs conversation\')">Aster Labs · Would love to learn more.</div></div></div><div class="card"><h3>Select a conversation</h3><p>Only accepted connections can message each other.</p></div></div>';
else if(page==='Investment interests')h=head('CONNECTION PIPELINE','Investment interests','Manage non-binding expressions of interest.')+'<div class="list">'+[['Mira Capital','Northstar Mobility','Sent · 2 days ago'],['Arjun Mehta','Aster Labs','Reviewing · 4 days ago'],['Horizon Ventures','TerraGrid','Interested · 1 week ago']].map(x=>'<div class="item"><b>'+x[0]+' · '+x[1]+'</b><span>'+x[2]+'</span><button class="btn sm" onclick="flash(\'Status updated in preview.\')">Update status</button></div>').join('')+'</div><div class="note">An expression of interest is not an investment commitment or transfer of funds.</div>';
else if(page==='Suggested matches')h=head('DISCOVERY','Suggested matches','A sample shortlist based on preferences.')+'<div class="grid">'+biz.slice(0,3).map(card).join('')+'</div>';
else if(page==='Saved profiles')h=head('YOUR SHORTLIST','Saved profiles','Profiles bookmarked for later.')+'<div class="grid">'+saved.map(i=>card(biz[i],i)).join('')+'</div>';
else if(page==='Announcements')h=head('COMMUNITY UPDATES','Announcements','News and updates from Ventora.')+'<div class="list"><div class="card"><span class="pill">PLATFORM UPDATE</span><h3>Welcome to Ventora Connect</h3><p>Discover businesses, connect with investors and keep your profile current.</p></div><div class="card"><span class="pill">IMPORTANT</span><h3>Stay safe while connecting</h3><p>Do your own due diligence. Verification does not guarantee an outcome.</p></div></div>';
else if(page==='Notifications')h=head('YOUR ACTIVITY','Notifications','Connection, message and profile activity.')+'<div class="list">'+[['New connection request','Mira Capital would like to connect.'],['New message','You have a new private message.'],['Profile viewed','Your profile was viewed by a member.']].map(x=>'<div class="item"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>';
else if(page==='Support')h=head('MEMBER CARE','How can we help you today?','Send a support request and view your history.')+'<div class="grid two"><form class="card form" onsubmit="event.preventDefault();flash(\'Support request submitted in preview only.\')"><h3>Contact support</h3>'+field('Subject','What do you need help with?')+'<div class="field"><label>How can we help?</label><textarea placeholder="Share details…"></textarea></div><button class="btn">Submit request</button></form><div class="card"><h3>Quick answers</h3><p>Ventora is a discovery and networking service, not a transaction platform.</p><p>Verification means a review step was completed; it does not guarantee outcomes.</p></div></div>';
else if(page==='Subscriptions')h=head('MEMBERSHIP','Subscriptions','Manage your plan and billing preferences.')+'<div class="card"><span class="pill">CURRENT PLAN</span><h2>Community access</h2><p>Explore profiles, manage your account and connect with members.</p><button class="btn ghost" onclick="modal(\'Plan details\')">View plan details</button></div>';
else if(page==='Settings')h=head('ACCOUNT','Settings','Manage account preferences and sign-in security.')+'<div class="grid two"><div class="card"><h3>Account details</h3><p>Email · Password · Sign-in methods</p><button class="btn ghost sm" onclick="modal(\'Account settings\')">Manage account</button></div><div class="card"><h3>Privacy & visibility</h3><p>Control profile discoverability and preferences.</p><button class="btn ghost sm" onclick="modal(\'Privacy settings\')">Privacy settings</button></div></div>';
else if(page==='Admin portal')h=head('VENTORA OPERATIONS','Admin command centre','Preview-only admin tools. No real members are affected.')+'<div class="statgrid">'+[['128','Members'],['42','Businesses'],['09','Pending reviews'],['06','Support tickets']].map(x=>'<div class="stat"><b>'+x[0]+'</b><small>'+x[1]+'</small></div>').join('')+'</div><div class="grid two">'+['Member management','Verification reviews','Business moderation','Support requests','Announcements','Platform activity'].map(x=>'<div class="card"><h3>'+x+'</h3><p>Review and manage '+x.toLowerCase()+'.</p><button class="btn ghost sm" onclick="modal(\''+x+'\')">Open section →</button></div>').join('')+'</div>';
document.getElementById('main').innerHTML=h+(notice?'<div class="note">'+notice+'</div>':'')+'<div class="foot">© 2026 VENTORA CONNECT · BUILT FOR AMBITION. <span style="float:right">Prototype only · No live data or transactions</span></div>'}
function filter(q){document.querySelectorAll('#cards .card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
render();
</script></body></html>
